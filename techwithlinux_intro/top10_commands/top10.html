// ---------- canvas-plane helper ----------
function textPlane(wUnits, cw, ch, draw, opts = {}) {
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d'); draw(ctx, cw, ch);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthTest: opts.depthTest ?? true, fog: false });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wUnits, wUnits * ch / cw), mat);
  if (opts.hud) m.renderOrder = 999;
  return m;
}
const FONT = '"Inter", "DejaVu Sans", sans-serif';
// shrink font until text fits maxW
function fitFont(c, text, maxW, size, weight) {
  let s = size; c.font = `${weight} ${s}px ${FONT}`;

}

  c.font = 'bold 36px "DejaVu Sans Mono", monospace';
  let y = 125, cx = 40, cy = 120, typing = false;
  for (const L of lines) {
    if (u < L.t0) break;
    if (L.c !== undefined) {
      const p = L.p || P;
      const n = Math.floor(clamp01((u - L.t0) / Math.max(.001, L.t1 - L.t0)) * L.c.length);

      const pw = c.measureText(p).width;
      c.fillStyle = '#ffffff'; c.shadowColor = '#9fdcff'; c.fillText(L.c.slice(0, n), 40 + pw, y);
      cx = 40 + pw + c.measureText(L.c.slice(0, n)).width; cy = y; typing = u < L.t1 + .28;
    } else {
      c.fillStyle = L.col || '#c9d6e3'; c.shadowColor = L.col || '#5cc8ff'; c.shadowBlur = 6; c.fillText(L.o, 40, y);
      cx = 40; cy = y + 62; typing = false;
    }
    y += 62;
  }
  c.shadowBlur = 0;
  if (!typing) { // idle prompt after last line
    const last = lines.filter(L => u >= L.t0).pop();

  }

  c.fillStyle = 'rgba(0,0,0,0.16)'; for (let s = 0; s < 720; s += 4) c.fillRect(0, s, 1280, 2);

function makeWord(str, size, depth, mat, y, x0, align = 'left') {
  const scale = size / font.data.resolution;
  const letters = []; let x = 0;
  for (const ch of str) {
    const adv = font.data.glyphs[ch].ha * scale + size * 0.04;
    if (ch !== ' ') {
      const geo = new TextGeometry(ch, { font, size, depth, height: depth, curveSegments: 10, bevelEnabled: true, bevelThickness: .05, bevelSize: .035, bevelSegments: 4 });
      geo.computeBoundingBox();
      const cx = (geo.boundingBox.max.x + geo.boundingBox.min.x) / 2;
      geo.translate(-cx, -size / 2, -depth / 2);
      const m = new THREE.Mesh(geo, mat);
      m.userData.home = new THREE.Vector3(x + cx, y, 0);
      letters.push(m); scene.add(m);
    }
    x += adv;
  }
  const off = align === 'center' ? x0 - x / 2 : x0;
  letters.forEach(m => m.userData.home.x += off);
  letters.width = x;
  return letters;
}
// in: letters fly from behind; out: letters shrink + rise
function animLetters(letters, t, start, step, dur, outAt, idle = 0) {
  letters.forEach((m, i) => {
    const k = seg(t, start + i * step, start + i * step + dur);
    const o = outAt == null ? 0 : seg(t, outAt + i * .025, outAt + i * .025 + .35);
    m.visible = k > 0 && o < 1;
    if (!m.visible) return;
    const e = easeOutBack(k), h = m.userData.home;
    m.position.set(h.x, h.y + (1 - easeOutCubic(k)) * 4 + easeInCubic(o) * 3, lerp(-25, 0, easeOutCubic(k)) + o * 4);
    m.rotation.set((1 - e) * -Math.PI, (1 - e) * Math.PI * 1.5 + Math.sin(t * 2 + i * .5) * .08 * idle, 0);
    m.scale.setScalar(tiny(e * (1 - easeInCubic(o))));
  });
}

window.renderFrame = (t, thumb = false) => {

  if (t < 2.7) {
    const k = easeInOutCubic(seg(t, 0, 2.7));
    camera.position.set(Math.sin(t * .6) * 1.2 * (1 - k), lerp(3, .6, k), lerp(24, 11, k));
    look.set(0, .6, 0);
  } else if (t < INTRO) {
    const k = easeInOutCubic(seg(t, 2.7, 4));
    const r = lerp(11, 15.5, k), a = Math.sin((t - 4) * .35) * .1;
    camera.position.set(Math.sin(a) * r, .6, Math.cos(a) * r);
    look.set(lerp(0, -.2, k), lerp(.6, -.1, k), 0);
  } else if (inSeg) {
    const u = t - INTRO - segIdx * SEG, dir = segIdx % 2 ? 1 : -1;
    const k = easeOutCubic(seg(u, 0, 1.3));
    const a = dir * lerp(.3, .07, k) - dir * u * .012;
    const r = lerp(17.5, 14.2, k);
    camera.position.set(Math.sin(a) * r, lerp(1.8, .4, k), Math.cos(a) * r);
    look.set(.2, -.1, 0);
  } else {
    const u = t - OUTRO_START;
    const k = easeInOutCubic(seg(u, 0, 1.5));
    const a = Math.sin(u * .35) * .1;
    const r = lerp(18, 15.5, k);
    camera.position.set(Math.sin(a) * r, .6, Math.cos(a) * r);
    look.set(-.3, -.5, 0);
  }
  camera.lookAt(look);

  // ----- intro -----
  const hk = seg(t, .2, .9), ho = seg(t, 2.35, 2.8);
  hook.visible = t < 2.8;
  hook.material.opacity = easeOutCubic(hk) * (1 - ho);
  hook.scale.setScalar(tiny(lerp(.7, 1, easeOutBack(hk)) * (1 + ho * .8)));
  flash += Math.max(0, 1 - Math.abs(t - 2.85) / .22);
  animLetters(introTop, t, 3.3, .12, .8, 6.35, 1);
  animLetters(introSub, t, 3.8, .07, .7, 6.4, 1);
  const itk = easeOutCubic(seg(t, 5.2, 5.9)) * (1 - seg(t, 6.3, 6.6));
  introTag.material.opacity = itk; introTag.visible = itk > 0;
  introTag.position.y = lerp(-2.2, -1.8, itk);
  thumbBadge.visible = thumb;

  // ----- Tux (intro + outro) -----
  let ts = 0, tx = t < INTRO ? -6.4 : -5.2, ty = -.6;
  if (t < INTRO) { const k = seg(t, 2.9, 4.2); ts = easeOutBack(k) * (1 - easeInCubic(seg(t, 6.3, 6.8))); ty = lerp(-6, -.6, easeOutCubic(k)); tux.rotation.y = (1 - easeOutCubic(k)) * Math.PI * 4 + Math.sin(t * .9) * .25; }
  else if (t >= OUTRO_START) { const k = seg(t, OUTRO_START + .9, OUTRO_START + 2.3); ts = easeOutBack(k); ty = lerp(-6, -.6, easeOutCubic(k)); tx = -5.2; tux.rotation.y = (1 - easeOutCubic(k)) * Math.PI * 4 + Math.sin(t * .9) * .25; }
  tuxRoot.visible = ts > 0.001;
  tuxRoot.scale.setScalar(tiny(ts));
  tuxRoot.position.set(tx, ty + Math.sin(t * 2.2) * .1, 0);
  ring.rotation.set(Math.PI / 2 + Math.sin(t) * .3, t * .8, 0);
  ring2.rotation.set(Math.PI / 2.3, -t * 1.1, Math.cos(t) * .3);
  if (thumb) { ring.rotation.set(1.25, .3, .2); ring2.rotation.set(1.1, -.5, -.3); tux.rotation.y = .25; }
  const wave = seg(t, OUTRO_START + 3.4, OUTRO_START + 5.8);
  wingR.rotation.z = .35 + (wave > 0 && wave < 1 ? (1.6 + Math.sin(wave * Math.PI * 6) * .45) * Math.sin(wave * Math.PI) : 0);
  wingL.rotation.z = -.35 - Math.sin(t * 2) * .05;

  // ----- command segments -----
  COMMANDS.forEach((C, i) => {
    const s0 = INTRO + i * SEG, u = t - s0;
    const active = u > -.1 && u < SEG + .1;
    animLetters(C.num, t, s0 + .15, .08, .6, s0 + 5.9);
    animLetters(C.word, t, s0 + .3, .1, .75, s0 + 5.95, 1);
    const lk = easeOutCubic(seg(u, .9, 1.5)) * (1 - seg(u, 5.9, 6.25));
    C.label.visible = active && lk > 0; C.label.material.opacity = lk; C.label.position.x = LEFT + 3.5 + (1 - lk) * -1;
    const sk = easeOutCubic(seg(u, .7, 1.2)) * (1 - seg(u, 6.0, 6.35));
    C.subPlane.visible = active && sk > 0; C.subPlane.material.opacity = sk;
    C.subPlane.position.y = -.98 - (1 - sk) * .1;
    if (active) flash += Math.max(0, 1 - Math.abs(u - .3) / .18) * .35;
  });
  // terminal
  term.visible = inSeg;
  if (inSeg) {
    const C = COMMANDS[segIdx], u = t - INTRO - segIdx * SEG;
    const k = easeOutBack(seg(u, .35, 1.05)), o = easeInCubic(seg(u, 5.85, 6.35));
    term.scale.setScalar(tiny(1.2 * k * (1 - o)));
    term.position.set(4.3 + o * 6, .35 + Math.sin(t * 1.5) * .06, 0);
    term.rotation.set(0, -.22 + (1 - k) * 1.2 - o * .8, 0);
    drawTerminal(C.term, u, `#${C.n}  ${C.cmd} — ${P.slice(0, -3)}`);
    // underline under the command word
    const bk = easeOutCubic(seg(u, 1.0, 1.6)) * (1 - seg(u, 5.9, 6.2));
    bar.visible = bk > 0; bar.scale.x = tiny(bk * 6.5);
    bar.position.set(LEFT + bar.scale.x / 2, -1.85, 0);
  }

  // ----- outro -----
  const os = OUTRO_START;
  if (t >= os) {
    animLetters(outW1, t, os + 1.4, .1, .8, null, 1);
    animLetters(outW2, t, os + 2.0, .14, .9, null, 1);
    const bk = easeOutCubic(seg(t, os + 2.6, os + 3.2));
    bar.visible = bk > 0; bar.scale.x = tiny(bk * 8.6); bar.position.set(-2.4 + bar.scale.x / 2, -2.35, 0);
  } else { [...outW1, ...outW2].forEach(m => m.visible = false); }
  if (t >= INTRO && !inSeg && t < os) bar.visible = false;
  if (t < INTRO) bar.visible = false;
  flash += t > os ? Math.max(0, 1 - Math.abs(t - (os + 2.6)) / .3) * .6 : 0;
  const otk = easeOutCubic(seg(t, os + 2.9, os + 3.5));
  outTag.visible = otk > 0; outTag.material.opacity = otk; outTag.position.y = lerp(-3.4, -3.0, otk);
  const oak = easeOutCubic(seg(t, os + .2, os + .9));
  outAsk.visible = oak > 0; outAsk.material.opacity = oak; outAsk.scale.setScalar(tiny(lerp(.8, 1, easeOutBack(oak))));
  const sbk = seg(t, os + 3.5, os + 4.2);
  sub.visible = sbk > 0;
  sub.scale.setScalar(tiny(easeOutBack(sbk) * (t > os + 4.4 ? 1 + Math.sin((t - os - 4.4) * 6) * .04 : 1)));

  water.visible = t > 3;
  renderer.toneMappingExposure = (1 + flash * 2.2) * (1 - seg(t, window.DURATION - .5, window.DURATION)) * seg(t, 0, .4);
  bloom.strength = .9 + flash * 1.2;
  matOrange.emissiveIntensity = 1 + Math.sin(t * 3) * .3;
  composer.render();
};
window.READY = true;
</script>
